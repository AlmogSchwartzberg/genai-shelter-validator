# Single source of truth for every notebook. Change a line here, rerun.
project_name: genai-shelter-validator
seed: 42

# Google Drive (mounted in Colab). Images and models live here, never in Git.
drive_root: /content/drive/MyDrive/genai-shelter-validator

domain: shelters       # check whether a shelter is valid: required objects + lookalike distractors
object_classes: []     # filled from Data/objects_table.csv (required objects and their lookalikes)

generation:
  model: stable-diffusion-v1-5/stable-diffusion-inpainting   # open question
  image_size: 512
  methods: [add_objects, scene_edits]   # add_objects also inserts lookalikes (PRD 3.4)
  scene_edits: [add_people, add_furniture, room_size, room_style]   # method B (PRD 3.5): AI edits, boxes protected
  box_change_threshold: 0.05   # drop an edited image if pixels inside any box changed more than this (assumed value)
  images_per_class: 100

autolabel:             # Code/autolabel.py: verify generated boxes with a zero-shot detector, write YOLO labels
  detector: IDEA-Research/grounding-dino-tiny   # fits a T4 easily
  box_threshold: 0.3
  text_threshold: 0.25
  min_iou: 0.4         # assumed value: reject an image if the detector finds no box overlapping the generated one this much. Calibrate on the 20-sample manual check
  refine: false        # true = keep the detector's box instead of the generated one
  prompts:             # detector phrase per class. A lookalike without its own phrase reuses the phrase of the object it imitates
    fire_extinguisher: fire extinguisher
    vent_cover: ventilation opening
    shelter_sign: sign
    light_fixture: ceiling light
    drinking_water: water bottle
    gas_cylinder: gas cylinder
    glass_item: mirror or picture frame

augmentation:          # mode 5, classical, no GenAI (PRD 3.9)
  conditions: [dark, bright, side_light, glare, blur, noise]

detection:
  models:              # need at least 3, at least one Transformer-based (PRD 3.8); third is an open question
    - PekingU/rtdetr_r50vd   # Transformer, Hugging Face
    - yolov8s.pt             # YOLO via Ultralytics, not Hugging Face; size is an open question
  batch_size: 4

split: {train: 0.8, test: 0.2, val_from_train: 0.1}   # PRD 3.1, 3.3; seed above
small_object_px: 32    # COCO definition of a small object
